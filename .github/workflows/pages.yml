name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site files from _parts
        run: |
          python3 << 'PY'
          import json
          from pathlib import Path
          parts_dir = Path("_parts")
          manifest_path = parts_dir / "manifest.json"
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              for name, parts in manifest.items():
                  text = "".join((parts_dir / p).read_text(encoding="utf-8") for p in parts)
                  Path(name).write_text(text, encoding="utf-8")
                  print(f"assembled {name} ({len(text)} chars) from {len(parts)} parts")
          else:
              print("no _parts/manifest.json — using checked-in files as-is")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
